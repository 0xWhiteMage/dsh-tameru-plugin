name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the harness extract for the pinned Harness
        run: |
          pin="$(cat DSH_PIN)"
          gh release download "harness-$pin" --repo "$GITHUB_REPOSITORY" -p "harness-$pin.tar.gz" -O /tmp/harness.tar.gz --clobber
          mkdir -p dev
          tar -xzf /tmp/harness.tar.gz -C dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Vendored engine matches its recorded commit
        run: |
          git clone --quiet https://github.com/0xWhiteMage/tameru-compaction-system /tmp/engine
          python scripts/check_vendored.py --engine /tmp/engine
